# When a change is merged into main, tell the Apple TV app (the familygamenight repo) so its "Send to TestFlight"
# workflow builds this newest engine and these question sets into the app and uploads it to TestFlight.
# It needs one secret here: FAMILYGAMENIGHT_TOKEN, a fine-grained token with Contents: Read and write on
# familygamenight (familygamenight's docs/TESTFLIGHT.md says how). Without it this only prints a warning.
name: Tell the Apple TV app

on:
  push:
    branches: [main]
    paths:            # only what goes into the app: the rules, the engine and the shipped question sets
      - 'games/**'
      - 'engine/**'
      - 'room.js'
      - 'lib.js'
      - 'data/**'
      - 'scripts/build-engine.mjs'
      - 'scripts/bundle-sets.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Start familygamenight's TestFlight upload
        env:
          TOKEN: ${{ secrets.FAMILYGAMENIGHT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::FAMILYGAMENIGHT_TOKEN is not set, so the Apple TV app was not told about this change (see familygamenight docs/TESTFLIGHT.md)."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/justinxwynkoop/familygamenight/dispatches \
            -d "{\"event_type\":\"gamenight-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
          echo "Sent. The upload shows under familygamenight → Actions → Send to TestFlight."
