# Builds the Apple TV app (tv-app/) on a Mac in the cloud, signs it and uploads it to TestFlight. It runs by itself:
#   - when a change that goes into the app is merged into main (the TV app, the rules, the engine or the shipped sets),
#   - on the 1st of every other month, so the build on the TVs never reaches Apple's 90-day expiry,
#   - and by hand: GitHub -> Actions -> "Send to TestFlight" -> Run workflow (the version box is optional).
# On a pull request it does everything except the upload: it builds, signs and exports the app with the same key, so a
# signing or build problem shows up as a red check before the merge instead of a failed upload after it.
# After an upload it sets the build's TestFlight "What to Test" notes from the pull request that was merged.
# A failed upload from main opens a GitHub issue (alert.yml), which emails the people watching the repository.
# Every run rebuilds the game engine and question sets from this same commit into the app first and runs the tests.
# It needs three repository secrets from an App Store Connect API key (see tv-app/docs/TESTFLIGHT.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole contents of the .p8 file).
# Without them it does nothing but say so.
#
# Version and build: the version is the one typed in, or else the first number in tv-app/Config/testflight-version.txt;
# the build number is 100 + this workflow's run number (the old familygamenight repo used builds 1 to 4), so it only
# ever goes up and automatic uploads never clash. If TestFlight already has a higher version or build (an upload from a
# Mac), the run goes above it instead, so a new build never looks older than the one on the TVs.
#
# A build made here does not contain your own sound files or extra question sets (they are not in the repository).
# To include them, archive from Xcode on your Mac instead (tv-app/docs/TESTFLIGHT.md).
name: Send to TestFlight

on:
  push:
    branches: [main]
    paths:            # only what goes into the app
      - 'tv-app/**'
      - '!tv-app/docs/**'
      - '!tv-app/**.md'
      - 'games/**'
      - 'engine/**'
      - 'room.js'
      - 'lib.js'
      - 'data/**'
      - 'scripts/build-engine.mjs'
      - 'scripts/bundle-sets.mjs'
      - 'package-lock.json'
      - '.github/workflows/testflight.yml'
  pull_request:
    paths:
      - 'tv-app/**'
      - '!tv-app/docs/**'
      - '!tv-app/**.md'
      - 'games/**'
      - 'engine/**'
      - 'room.js'
      - 'lib.js'
      - 'data/**'
      - 'scripts/build-engine.mjs'
      - 'scripts/bundle-sets.mjs'
      - 'package-lock.json'
      - '.github/workflows/testflight.yml'
  schedule:
    - cron: '17 9 1 */2 *'   # 09:17 UTC on the 1st of every other month
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to upload, like 1.2 (optional; empty uses the one in tv-app/Config/testflight-version.txt)'
        required: false

concurrency:
  # Uploads wait their turn; a pull request's check only waits for (and replaces) that pull request's own last check.
  group: ${{ github.event_name == 'pull_request' && format('testflight-check-{0}', github.ref) || 'testflight' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_ID: family.singonight.app
  APP_NAME: Family Game Night

jobs:
  upload:
    name: ${{ github.event_name == 'pull_request' && 'Build and sign for TestFlight (no upload)' || 'Upload to TestFlight' }}
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.build.outputs.version }}
      build: ${{ steps.build.outputs.build }}
      app_id: ${{ steps.asc.outputs.app_id }}
    defaults:
      run:
        working-directory: tv-app
    steps:
      - name: Check the App Store Connect key is set up
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::warning::The App Store Connect key secrets are not added yet (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8). Skipping the TestFlight upload."
            echo "ready=false" >> $GITHUB_ENV
          else
            echo "ready=true" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
        if: env.ready == 'true'
      - name: Use Xcode 26 (Apple only accepts apps built with the tvOS 26 SDK or later)
        if: env.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Build the engine and question sets from this commit into the app
        if: env.ready == 'true'
        run: |
          (cd .. && npm ci --no-audit --no-fund)
          node ../scripts/build-engine.mjs "$PWD/FamilyGameNight/GameNight/Engine/engine.js"
          node ../scripts/bundle-sets.mjs "$PWD/FamilyGameNight/GameNight/Engine/sets.json"
          git diff --stat -- FamilyGameNight/GameNight/Engine || true
      - name: Run the tests with that engine
        if: env.ready == 'true'
        run: |
          swift test > test.log 2>&1 && status=0 || status=$?
          grep -E "error:|failed \(" test.log || true
          grep -E "Executed [0-9]+ tests" test.log | tail -n 3
          exit $status
      - name: Write the key file
        if: env.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d "[:space:]"); ASC_ISSUER_ID=$(printf %s "${ASC_ISSUER_ID:-}" | tr -d "[:space:]"); export ASC_KEY_ID ASC_ISSUER_ID   # a pasted space or newline breaks the sign-in
          mkdir -p ~/private_keys
          # Rebuild the .p8 from whatever was pasted into the secret: Windows line endings, the BEGIN/END lines missing,
          # or everything on one line all still work. Only the shape is checked and reported, never the key itself.
          python3 - "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import os, re, sys, textwrap, base64
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"\s+", "", body)
          ok = len(body) > 100 and re.fullmatch(r"[A-Za-z0-9+/=]+", body)
          if ok:
              try: base64.b64decode(body, validate=True)
              except Exception: ok = False
          if not ok:
              print(f"::error::ASC_KEY_P8 does not look like a .p8 key ({len(raw)} characters pasted, "
                    f"{'with' if 'BEGIN' in raw else 'without'} a BEGIN line). Paste the whole AuthKey_<KEY ID>.p8 file, opened in Notepad.")
              sys.exit(1)
          with open(sys.argv[1], "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> $GITHUB_ENV
      - name: Prepare App Store Connect
        if: env.ready == 'true'
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d "[:space:]"); ASC_ISSUER_ID=$(printf %s "${ASC_ISSUER_ID:-}" | tr -d "[:space:]"); export ASC_KEY_ID ASC_ISSUER_ID   # a pasted space or newline breaks the sign-in
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 Tools/asc.py prepare "$BUNDLE_ID" "$APP_NAME"
      - name: Build, sign and upload to TestFlight (on a pull request, build and sign only)
        if: env.ready == 'true' && steps.asc.outputs.app_exists == 'true'
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
        run: |
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d "[:space:]"); ASC_ISSUER_ID=$(printf %s "${ASC_ISSUER_ID:-}" | tr -d "[:space:]"); export ASC_KEY_ID ASC_ISSUER_ID   # a pasted space or newline breaks the sign-in
          set -o pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then read -r VERSION _ < Config/testflight-version.txt; fi
          case "$VERSION" in *[!0-9.]*|.*|*.|*..*|"") echo "::error::The version must look like 1.2, not $VERSION"; exit 1 ;; esac
          # Never go below what is already in TestFlight: a Mac upload (Tools/upload-testflight.sh) may have used a
          # higher version or build than this repository knows about, and TestFlight shows the newest upload.
          LATEST_VERSION="${{ steps.asc.outputs.latest_version }}"
          LATEST_BUILD="${{ steps.asc.outputs.latest_build }}"
          if [ -n "$LATEST_VERSION" ] && python3 -c 'import sys; k=lambda v: [int(p) for p in v.split(".")]; sys.exit(0 if k(sys.argv[2]) > k(sys.argv[1]) else 1)' "$VERSION" "$LATEST_VERSION"; then
            echo "::warning::TestFlight already has version $LATEST_VERSION, higher than $VERSION; uploading as $LATEST_VERSION. Raise tv-app/Config/testflight-version.txt."
            VERSION="$LATEST_VERSION"
          fi
          BUILD=$((100 + ${{ github.run_number }}))
          if [ "$VERSION" = "$LATEST_VERSION" ] && [ "${LATEST_BUILD:-0}" -ge "$BUILD" ]; then BUILD=$((LATEST_BUILD + 1)); fi
          DESTINATION=upload
          if [ "${{ github.event_name }}" = "pull_request" ]; then DESTINATION=export; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $ASC_KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          mkdir -p build
          # Archive unsigned and let the export sign it in the cloud. Signing the archive made Xcode create a new
          # development certificate on every fresh runner, and once the team hit Apple's limit every upload failed
          # ("Your account has reached the maximum number of certificates").
          xcodebuild -project FamilyGameNight.xcodeproj -scheme FamilyGameNight -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath build/FamilyGameNight.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$BUILD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/FamilyGameNight.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH | tail -n 40
          if [ "$DESTINATION" = export ]; then
            ls build/export/*.ipa > /dev/null || { echo "::error::The export made no .ipa"; exit 1; }
            echo "Built and signed version $VERSION (build $BUILD) for TestFlight. Nothing was uploaded (this is a pull request check)."
          else
            echo "Uploaded version $VERSION (build $BUILD). It appears in TestFlight after Apple finishes processing it (usually 5 to 15 minutes)."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove the key file
        if: always()
        working-directory: .
        run: rm -rf ~/private_keys

  notes:
    # The "What to Test" text the TestFlight app shows for this build. Waits (cheaply, on Linux) for Apple to receive
    # the upload. Never fails the run: a missing note is only a warning.
    name: Set the TestFlight "What to Test" notes
    needs: upload
    if: needs.upload.outputs.build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Write the notes
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          VERSION: ${{ needs.upload.outputs.version }}
          BUILD: ${{ needs.upload.outputs.build }}
        run: |
          python3 - > notes.txt <<'PY'
          import os
          event, msg = os.environ["EVENT"], os.environ.get("MESSAGE", "").strip()
          lines = [l.strip() for l in msg.splitlines() if l.strip() and not l.lower().startswith(("co-authored-by", "claude-session"))]
          if event == "schedule":
              print("Scheduled rebuild so the app on the TVs does not expire. Nothing new to try.")
          elif lines and lines[0].startswith("Merge pull request"):
              # "Merge pull request #21 from ..." then the pull request's title
              number = lines[0].split()[3] if len(lines[0].split()) > 3 else ""
              print((lines[1] if len(lines) > 1 else "Changes") + (f" (pull request {number})" if number else ""))
          elif lines:
              print("\n".join(lines[:6]))
          else:
              print("A new build.")
          print(f"\nVersion {os.environ['VERSION']} ({os.environ['BUILD']}).")
          PY
          cat notes.txt
      - name: Set them in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d "[:space:]"); ASC_ISSUER_ID=$(printf %s "${ASC_ISSUER_ID:-}" | tr -d "[:space:]"); export ASC_KEY_ID ASC_ISSUER_ID
          mkdir -p ~/private_keys
          python3 - "$HOME/private_keys/key.p8" <<'PY'
          import os, re, sys, textwrap
          body = re.sub(r"\s+", "", re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", os.environ["ASC_KEY_P8"]))
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          export ASC_KEY_PATH=$HOME/private_keys/key.p8
          python3 -m pip install --quiet pyjwt cryptography
          python3 tv-app/Tools/asc.py notes "${{ needs.upload.outputs.app_id }}" "${{ needs.upload.outputs.version }}" "${{ needs.upload.outputs.build }}" notes.txt
          rm -rf ~/private_keys
