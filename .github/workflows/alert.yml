# Tells people when something on main breaks, so a failed Apple TV upload never sits unnoticed again (TestFlight runs
# 19 to 21 failed quietly and the TVs kept an old build). When "Send to TestFlight", "Apple TV app" or "Test" fails on
# main, this opens a GitHub issue (or adds to the one already open), assigned to Jason; GitHub emails it. The next
# successful run of that workflow on main closes the issue.
name: Alert when main breaks

on:
  workflow_run:
    workflows: ["Send to TestFlight", "Apple TV app", "Test"]
    types: [completed]
    branches: [main]

permissions:
  issues: write
  actions: read

jobs:
  alert:
    runs-on: ubuntu-latest
    # A pull request's own checks are on its branch and show on the pull request; only main is watched here.
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const bad = ['failure', 'timed_out', 'startup_failure'].includes(run.conclusion)
              || (run.conclusion === 'cancelled' && run.name === 'Send to TestFlight');
            const title = `Main is broken: "${run.name}" failed`;
            const { owner, repo } = context.repo;
            await github.rest.issues.createLabel({ owner, repo, name: 'main-broken', color: 'd73a4a', description: 'A workflow failed on main' }).catch(() => {});
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'main-broken', per_page: 100 }))
              .data.filter((i) => i.title === title);
            const what = run.name === 'Send to TestFlight'
              ? 'The Apple TV build was **not** uploaded, so the TVs keep the last good build until this is fixed.'
              : 'Nothing has been rolled back; the website and the Apple TV may have the broken change.';
            if (bad) {
              const body = `${what}\n\nRun: ${run.html_url}\nCommit: ${run.head_commit?.message?.split('\n')[0] ?? run.head_sha} (${run.head_sha.slice(0, 7)})\nResult: ${run.conclusion}\n\nThis issue closes itself when "${run.name}" next passes on main.`;
              if (open.length) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `Failed again.\n\n${body}` });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['main-broken'], assignees: ['JasonWynkoop1'] })
                  .catch(() => github.rest.issues.create({ owner, repo, title, body, labels: ['main-broken'] }));
              }
              core.warning(`${title}: ${run.html_url}`);
            } else if (run.conclusion === 'success') {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `Passing again: ${run.html_url}` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
            }
