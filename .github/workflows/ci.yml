name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The web folder is up to date
        run: |
          node scripts/build-web.mjs
          git diff --exit-code -- web || (echo "web/ is out of date: run node scripts/build-web.mjs and commit" && exit 1)
      - name: The phone and host pages work in a real browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/e2e-phone.mjs
      - name: The online relay works against the real Supabase project
        run: node scripts/relay-live.mjs
